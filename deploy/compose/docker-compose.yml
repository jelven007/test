name: banxia-strategy

x-app-common: &app-common
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &app-environment
    TZ: Asia/Shanghai
    BANXIA_ENVIRONMENT: local-compose
    BANXIA_LOG_LEVEL: INFO
    BANXIA_METRICS_PORT: 9100
    BANXIA_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    BANXIA_REPORT_DIRS: /app/scheduled_reports,/app/reports
    BANXIA_REPORT_SCHEDULE: ${BANXIA_REPORT_SCHEDULE:-16:30,23:30}
    BANXIA_STRATEGY_CONFIG: /app/config/strategy.json
    BANXIA_MONITOR_WATCHLIST: /app/config/monitor_watchlist.json
    BANXIA_WATCH_DATE: ${BANXIA_WATCH_DATE:-}
    BANXIA_COLLECTOR_WAL_PATH: /app/data/wal/market-collector.sqlite3
    BANXIA_STORAGE_MODE: required
    BANXIA_POSTGRES_DSN: postgresql://${POSTGRES_USER:-banxia}:${POSTGRES_PASSWORD:-banxia-local}@postgres:5432/${POSTGRES_DB:-banxia}
    BANXIA_CLICKHOUSE_HOST: clickhouse
    BANXIA_CLICKHOUSE_PORT: 8123
    BANXIA_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-banxia}
    BANXIA_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-banxia}
    BANXIA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-banxia-local}
    BANXIA_REDIS_URL: redis://:${REDIS_PASSWORD:-banxia-local}@redis:6379/0
    BANXIA_MINIO_ENDPOINT: minio:9000
    BANXIA_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-banxia}
    BANXIA_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
    BANXIA_MINIO_SECURE: "false"
    BANXIA_MINIO_REPORT_BUCKET: strategy-reports
    BANXIA_STRATEGY_VERSION: ${BANXIA_STRATEGY_VERSION:-v1}
    BANXIA_CODE_COMMIT: ${BANXIA_CODE_COMMIT:-local}
  volumes:
    - ../../config:/app/config:ro
    - ../../reports:/app/reports:ro
    - ../../scheduled_reports:/app/scheduled_reports:ro
    - collector-wal:/app/data/wal
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banxia}
      POSTGRES_USER: ${POSTGRES_USER:-banxia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banxia-local}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-banxia}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-banxia}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-banxia-local}
      TZ: Asia/Shanghai
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-banxia-local}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:-banxia-local}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-banxia-local}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-banxia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-banxia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
    volumes:
      - ./minio/create-buckets.sh:/opt/banxia/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/opt/banxia/create-buckets.sh"]
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka/create-topics.sh:/opt/banxia/create-topics.sh:ro
    command: ["bash", "/opt/banxia/create-topics.sh"]
    restart: "no"

  flink-jobmanager:
    build:
      context: ../..
      dockerfile: deploy/flink/Dockerfile
    command: jobmanager
    environment: &flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        parallelism.default: 2
        state.backend.type: hashmap
        state.checkpoints.dir: s3p://flink-state/checkpoints
        state.savepoints.dir: s3p://flink-state/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-banxia}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    ports:
      - "${FLINK_WEB_PORT:-8081}:8081"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8081/overview >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: ../..
      dockerfile: deploy/flink/Dockerfile
    command: taskmanager
    environment:
      <<: *flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend.type: hashmap
        state.checkpoints.dir: s3p://flink-state/checkpoints
        state.savepoints.dir: s3p://flink-state/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-banxia}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: unless-stopped

  flink-feature-job:
    build:
      context: ../..
      dockerfile: deploy/flink/Dockerfile
    command:
      - bash
      - -ec
      - |
        if curl --fail --silent http://flink-jobmanager:8081/jobs/overview \
          | grep -Eq '"name":"banxia-realtime-features-v1".*"state":"(CREATED|INITIALIZING|RUNNING|FAILING|RESTARTING|RECONCILING)"'; then
          echo "Flink feature job is already running; skipping submission."
          exit 0
        fi
        sed "s|__KAFKA_BOOTSTRAP_SERVERS__|${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}|g" \
          /opt/banxia/sql/realtime_features.sql >/tmp/realtime_features.sql
        /opt/flink/bin/sql-client.sh -f /tmp/realtime_features.sql 2>&1 \
          | tee /tmp/sql-client.log
        if grep -Fq '[ERROR]' /tmp/sql-client.log; then
          exit 1
        fi
    environment:
      <<: *flink-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  market-collector:
    <<: *app-common
    command: ["market-collector"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  market-sink:
    <<: *app-common
    command: ["market-sink"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  feature-worker:
    <<: *app-common
    command: ["feature-worker"]
    profiles: ["python-feature-fallback"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  strategy-engine:
    <<: *app-common
    command: ["strategy-engine"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-feature-job:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  outbox-relay:
    <<: *app-common
    command: ["outbox-relay"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  projection-worker:
    <<: *app-common
    command: ["projection-worker"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  report-worker:
    <<: *app-common
    command: ["report-worker"]
    profiles: ["jobs"]
    environment:
      <<: *app-environment
      BANXIA_REPORT_OUTPUT_DIR: /app/reports
      BANXIA_REPORT_DATE: ${BANXIA_REPORT_DATE:-}
    volumes:
      - ../../config:/app/config:ro
      - ../../reports:/app/reports
      - ../../scheduled_reports:/app/scheduled_reports:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  report-scheduler:
    <<: *app-common
    command: ["report-scheduler"]
    environment:
      <<: *app-environment
      BANXIA_REPORT_OUTPUT_DIR: /app/reports
    volumes:
      - ../../config:/app/config:ro
      - ../../reports:/app/reports
      - ../../scheduled_reports:/app/scheduled_reports:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  api:
    <<: *app-common
    command: ["api"]
    environment:
      <<: *app-environment
      BANXIA_API_HOST: 0.0.0.0
      BANXIA_API_PORT: 8765
      BANXIA_API_TOKEN: ${BANXIA_API_TOKEN:-}
    ports:
      - "${BANXIA_API_PORT:-8765}:8765"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      strategy-engine:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  minio-data:
  kafka-data:
  collector-wal:
  prometheus-data:
