apiVersion: v1
kind: ConfigMap
metadata:
  name: banxia-runtime
  namespace: banxia
data:
  BANXIA_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  BANXIA_CLICKHOUSE_HOST: clickhouse
  BANXIA_CLICKHOUSE_PORT: "8123"
  BANXIA_CLICKHOUSE_NATIVE_PORT: "9000"
  BANXIA_CLICKHOUSE_DATABASE: banxia
  BANXIA_CLICKHOUSE_USER: banxia
  BANXIA_MINIO_ENDPOINT: minio:9000
  BANXIA_MINIO_SECURE: "false"
  BANXIA_MINIO_REPORT_BUCKET: strategy-reports
  BANXIA_MINIO_MARKET_BUCKET: market-raw
