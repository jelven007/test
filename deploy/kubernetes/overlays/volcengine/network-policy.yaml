apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: banxia
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-metrics
  namespace: banxia
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: banxia
        - namespaceSelector:
            matchLabels:
              banxia.io/metrics-access: "true"
      ports:
        - {protocol: TCP, port: 9100}
        - {protocol: TCP, port: 9249}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datastore-access
  namespace: banxia
spec:
  podSelector:
    matchLabels:
      component: datastore
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: banxia
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
        - {protocol: TCP, port: 8123}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9001}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flink-control-plane
  namespace: banxia
spec:
  podSelector:
    matchLabels:
      app: banxia-flink
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: banxia
      ports:
        - {protocol: TCP, port: 6123}
        - {protocol: TCP, port: 6124}
        - {protocol: TCP, port: 8081}
