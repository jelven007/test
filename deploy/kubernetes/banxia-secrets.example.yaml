apiVersion: v1
kind: Secret
metadata:
  name: banxia-secrets
  namespace: banxia
type: Opaque
stringData:
  BANXIA_POSTGRES_DSN: postgresql://USER:PASSWORD@postgres.strategy.svc:5432/banxia
  BANXIA_CLICKHOUSE_PASSWORD: CHANGE_ME
  BANXIA_REDIS_URL: redis://:PASSWORD@redis.strategy.svc:6379/0
  BANXIA_MINIO_ACCESS_KEY: CHANGE_ME
  BANXIA_MINIO_SECRET_KEY: CHANGE_ME
  BANXIA_API_TOKEN: CHANGE_ME
  BANXIA_CODE_COMMIT: IMAGE_GIT_COMMIT
