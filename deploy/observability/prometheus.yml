global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: banxia-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8765"]

  - job_name: banxia-workers
    static_configs:
      - targets:
          - market-collector:9100
          - market-sink:9100
          - strategy-engine:9100
          - outbox-relay:9100
          - projection-worker:9100

  - job_name: flink
    metrics_path: /
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]
