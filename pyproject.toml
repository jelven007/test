[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banxia-strategy"
version = "0.1.0"
description = "A-share daily first-board to second-board research screener"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "mootdx>=0.11.7,<0.12",
]

[project.optional-dependencies]
storage = [
  "clickhouse-connect>=0.8,<0.11",
  "minio>=7.2,<8",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<7",
]
production = [
  "clickhouse-connect>=0.8,<0.11",
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "minio>=7.2,<8",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
banxia-strategy = "banxia_strategy.cli:main"
banxia-service = "banxia_strategy.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banxia_strategy = ["web/*.html", "web/*.css", "web/*.js"]
