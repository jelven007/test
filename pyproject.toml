[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banxia-strategy"
version = "0.1.0"
description = "A-share daily first-board to second-board research screener"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "mootdx>=0.11.7,<0.12",
]

[project.scripts]
banxia-strategy = "banxia_strategy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banxia_strategy = ["web/*.html", "web/*.css", "web/*.js"]
