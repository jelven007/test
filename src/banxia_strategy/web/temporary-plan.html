<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f6f7f5">
    <title>临时次日计划 · 一进二</title>
    <link rel="stylesheet" href="/styles.css?v=20260926.1">
    <link rel="stylesheet" href="/ui-standard.css?v=20260926.2">
    <link rel="stylesheet" href="/temporary.css?v=20260929.1">
    <script src="/auth.js?v=20260927.2" defer></script>
    <script src="/strategy-selector.js?v=20260926.1" defer></script>
    <script src="/trading-calendar.js?v=20260926.3" defer></script>
    <script src="/temporary.js?v=20260929.1" defer></script>
  </head>
  <body class="temporary-body" data-temporary-page="plan">
    <header class="topbar temporary-topbar">
      <a class="brand" href="/" aria-label="返回股票首页">
        <span class="brand-mark" aria-hidden="true">BX</span>
        <strong>一进二</strong>
      </a>
      <div class="report-tools">
        <label for="report-date">收盘日</label>
        <select id="report-date" class="ui-control" aria-label="选择计划参考交易日" disabled></select>
        <button id="refresh-button" type="button" class="ui-button">生成十份</button>
      </div>
      <div class="dashboard-meta">
        <div class="source-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connection" role="status">正在读取临时计划</span>
        </div>
        <div data-account-slot></div>
      </div>
    </header>
    <nav class="primary-nav" aria-label="主导航">
      <a href="/">首页</a>
      <a href="/strategy">策略管理</a>
      <a href="/plan">次日计划</a>
      <a href="/monitor">当日实盘</a>
      <a href="/temporary-plan" aria-current="page">临时次日计划</a>
      <a href="/temporary-monitor">临时当日实盘</a>
      <a href="/research">回测优化</a>
      <a href="/settings">系统设置</a>
    </nav>

    <main class="temporary-main page-main">
      <section class="temporary-heading page-header">
        <div class="page-header-copy">
          <p class="eyebrow">TEN STRATEGY PLAN MATRIX</p>
          <h1><span id="display-date">—</span> 临时次日计划</h1>
          <p id="scope">正在汇总十条初始策略</p>
        </div>
      </section>

      <div id="temporary-error" class="notice is-error" role="alert" hidden></div>

      <section class="temporary-summary" aria-label="临时计划汇总">
        <div><span>初始策略</span><strong id="strategy-count">—</strong></div>
        <div><span>已生成</span><strong id="ready-count">—</strong></div>
        <div><span>候选合计</span><strong id="candidate-count">—</strong></div>
        <div><span>计划执行日</span><strong id="execution-date">—</strong></div>
      </section>

      <nav id="strategy-jump" class="strategy-jump" aria-label="策略清单索引"></nav>
      <section id="strategy-plans" class="strategy-plan-list" aria-live="polite">
        <div class="temporary-loading"><span class="loading-rule"></span><p>读取十策略计划</p></div>
      </section>

      <footer class="temporary-footer">
        <p>临时计划只读取十条受保护初始策略，不改变当前激活策略。所有候选仅供条件观察，不自动下单。</p>
        <p>行情和历史数据仅来自 mootdx；低于 2 亿元成交额、10:00 后确认或盘中跌破昨收时，按各策略规则放弃。</p>
      </footer>
    </main>
  </body>
</html>
