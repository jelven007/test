openapi: 3.0.3
info:
  title: Banxia Strategy Research API
  version: 1.0.0
  description: |
    一进二策略研究系统 HTTP API。
    系统只提供研究、监控和报告能力，不提供自动下单接口。
servers:
  - url: https://strategy.example.com
    description: Production
  - url: http://127.0.0.1:8765
    description: Local development
tags:
  - name: Health
  - name: Monitor
  - name: Reports
  - name: Strategies
  - name: StrategyRuns
  - name: Research
paths:
  /api/v1/health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 进程存活检查
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 服务就绪检查
      security: []
      responses:
        "200":
          description: 关键依赖可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 关键依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/system/status:
    get:
      tags: [Health]
      operationId: getSystemStatus
      summary: 查询采集、消费和存储状态
      responses:
        "200":
          description: 系统状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/monitor:
    get:
      tags: [Monitor]
      operationId: getMonitorSnapshot
      summary: 查询当前监控快照
      parameters:
        - name: trade_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: symbols
          in: query
          required: false
          description: 逗号分隔的六位股票代码
          schema:
            type: string
            pattern: '^\d{6}(,\d{6})*$'
        - $ref: "#/components/parameters/StrategyIdQuery"
      responses:
        "200":
          description: 监控快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/monitor/events:
    get:
      tags: [Monitor]
      operationId: listDecisionEvents
      summary: 查询策略决策事件
      parameters:
        - name: symbol
          in: query
          schema:
            $ref: "#/components/schemas/Symbol"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/DecisionStateCode"
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: trade_date
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/StrategyIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 决策事件列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DecisionEvent"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/monitor/stream:
    get:
      tags: [Monitor]
      operationId: streamMonitorEvents
      summary: 订阅监控 SSE
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
        - name: trade_date
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/StrategyIdQuery"
      responses:
        "200":
          description: |
            SSE 事件流。事件类型包括 snapshot、decision.changed、data.degraded 和 heartbeat。
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: 查询历史报告
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/StrategyIdQuery"
      responses:
        "200":
          description: 报告列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportSummary"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/reports/{tradeDate}:
    get:
      tags: [Reports]
      operationId: getReport
      summary: 查询指定参考日的完整报告
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - $ref: "#/components/parameters/StrategyIdQuery"
      responses:
        "200":
          description: 完整报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/{tradeDate}/refresh:
    post:
      tags: [Reports]
      operationId: refreshReport
      summary: 提交指定参考日的报告重新生成任务
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - $ref: "#/components/parameters/StrategyIdQuery"
      responses:
        "202":
          description: 已创建独立的报告刷新任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRefreshJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/report-jobs/{jobId}:
    get:
      tags: [Reports]
      operationId: getReportRefreshJob
      summary: 查询报告刷新任务状态
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 报告刷新任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRefreshJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/{tradeDate}/assets/{format}:
    get:
      tags: [Reports]
      operationId: getReportAsset
      summary: 获取报告文件
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [markdown, json, csv]
        - $ref: "#/components/parameters/StrategyIdQuery"
      responses:
        "302":
          description: 跳转到短期有效的对象存储签名地址
          headers:
            Location:
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/strategies:
    get:
      tags: [Strategies]
      operationId: listStrategies
      summary: 列出未归档策略
      parameters:
        - name: q
          in: query
          description: 按策略名称或编码模糊查询
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, inactive]
            default: all
        - $ref: "#/components/parameters/Limit100"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: 策略列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Strategy"
                  total:
                    type: integer
    post:
      tags: [Strategies]
      operationId: createStrategy
      summary: 将初始策略的参数变更另存为不可变策略
      description: 不提供独立新建或复制；来源必须是系统初始策略，且参数必须发生变化。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStrategyRequest"
      responses:
        "201":
          description: 已创建策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/strategies/{strategy_id}:
    parameters:
      - $ref: "#/components/parameters/StrategyIdPath"
    patch:
      tags: [Strategies]
      operationId: updateStrategyMetadataOrState
      summary: 单独修改策略名称或激活状态
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RenameStrategyRequest"
                - $ref: "#/components/schemas/SetStrategyActiveRequest"
      responses:
        "200":
          description: 更新后的策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Strategies]
      operationId: deleteStrategy
      summary: 永久删除策略及其关联业务数据
      description: >-
        删除策略定义、次日计划、当日实盘决策、回测优化记录和报告资产。
        子策略保留，但解除其父策略引用；共享 mootdx 行情不删除。
      responses:
        "204":
          description: 策略及关联数据已删除
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/strategy-jobs/{job_id}:
    get:
      tags: [Strategies]
      operationId: getStrategyHistoryJob
      summary: 查询策略历史数据生成任务
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 历史次日计划与当日实盘生成状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyHistoryJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/strategy-config:
    get:
      tags: [Strategies]
      operationId: getStrategyConfig
      summary: 查询策略配置和编辑 Schema
      parameters:
        - $ref: "#/components/parameters/StrategyIdQuery"
      responses:
        "200":
          description: 配置、默认值、字段和 revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyConfigPayload"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [Strategies]
      operationId: replaceLegacyStrategyConfig
      summary: 文件兼容模式保存配置；策略目录模式禁止覆盖
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, revision]
              properties:
                config:
                  type: object
                  additionalProperties: true
                revision:
                  type: string
      responses:
        "200":
          description: 文件兼容模式保存成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyConfigPayload"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/strategies/{strategy_id}/days:
    get:
      tags: [Strategies]
      operationId: listStrategyDays
      summary: 查询策略交易日摘要
      parameters:
        - $ref: "#/components/parameters/StrategyIdPath"
        - name: before
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Limit100"
      responses:
        "200":
          description: 交易日摘要
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StrategyDaySummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/strategies/{strategy_id}/days/{trade_date}:
    get:
      tags: [Strategies]
      operationId: getStrategyDay
      summary: 查询策略单日完整记录
      parameters:
        - $ref: "#/components/parameters/StrategyIdPath"
        - $ref: "#/components/parameters/TradeDateSnake"
      responses:
        "200":
          description: 次日计划、执行计划和实际行情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyDay"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/strategy-runs/{runId}:
    get:
      tags: [StrategyRuns]
      operationId: getStrategyRun
      summary: 查询策略运行状态
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 策略运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/research:
    get:
      tags: [Research]
      operationId: listResearchRuns
      summary: 查询最近的研究实验
      responses:
        "200":
          description: 最近 50 个实验
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResearchSummary"
  /api/v1/research/{run_id}:
    get:
      tags: [Research]
      operationId: getResearchRun
      summary: 查询研究实验完整结果
      parameters:
        - $ref: "#/components/parameters/ResearchRunId"
      responses:
        "200":
          description: 实验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/research/{run_id}/strategy:
    get:
      tags: [Research]
      operationId: downloadResearchStrategy
      summary: 下载研究策略 JSON
      parameters:
        - $ref: "#/components/parameters/ResearchRunId"
      responses:
        "200":
          description: 完整策略配置
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/research/{run_id}/assets/{filename}:
    get:
      tags: [Research]
      operationId: downloadResearchAsset
      summary: 下载实验资产
      parameters:
        - $ref: "#/components/parameters/ResearchRunId"
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 数据库资产索引中的文件流
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit100:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    TradeDate:
      name: tradeDate
      in: path
      required: true
      schema:
        type: string
        format: date
    TradeDateSnake:
      name: trade_date
      in: path
      required: true
      schema:
        type: string
        format: date
    StrategyIdQuery:
      name: strategy_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    StrategyIdPath:
      name: strategy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResearchRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: 关键依赖不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 配置冲突、不可变策略或没有激活策略
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 字段或业务规则校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Symbol:
      type: string
      pattern: '^\d{6}$'
      example: "002909"
    Health:
      type: object
      required: [status, server_time]
      properties:
        status:
          type: string
          enum: [ok]
        server_time:
          type: string
          format: date-time
    Readiness:
      type: object
      required: [status, server_time, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        server_time:
          type: string
          format: date-time
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, unavailable]
    SystemStatus:
      type: object
      required: [server_time, collection, messaging, storage]
      properties:
        server_time:
          type: string
          format: date-time
        collection:
          type: object
          additionalProperties: true
        messaging:
          type: object
          additionalProperties: true
        storage:
          type: object
          additionalProperties: true
    DataStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [fresh, delayed, stale, unavailable]
        max_quote_age_seconds:
          type: number
          nullable: true
        consumer_lag:
          type: integer
          nullable: true
    DecisionStateCode:
      type: string
      enum:
        - expired
        - ineligible
        - pre
        - stale
        - no_quote
        - reference_changed
        - missing_rules
        - auction
        - no_open
        - reject_open
        - reject_low
        - outside_open
        - window_closed
        - sealed
        - at_limit
        - near_limit
        - watch
        - unavailable
    Decision:
      type: object
      required: [state, label, reason_code, reason, irreversible, updated_at]
      properties:
        state:
          $ref: "#/components/schemas/DecisionStateCode"
        label:
          type: string
        reason_code:
          type: string
        reason:
          type: string
        irreversible:
          type: boolean
        updated_at:
          type: string
          format: date-time
    StockSnapshot:
      type: object
      required:
        - symbol
        - name
        - source_time
        - collected_at
        - decision
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        name:
          type: string
        industry:
          type: string
          nullable: true
        rank:
          type: integer
          nullable: true
        score:
          type: number
          nullable: true
        origin:
          type: string
        eligible:
          type: boolean
        eligibility_reason:
          type: string
          nullable: true
        reference_date:
          type: string
          format: date
        plan_date:
          type: string
          format: date
        source_time:
          type: string
          format: date-time
        collected_at:
          type: string
          format: date-time
        price:
          type: number
          format: double
          nullable: true
        open:
          type: number
          nullable: true
        high:
          type: number
          nullable: true
        low:
          type: number
          nullable: true
        previous_close:
          type: number
          nullable: true
        change_pct:
          type: number
          format: double
          nullable: true
        open_change_pct:
          type: number
          format: double
          nullable: true
        amount_cny:
          type: number
          format: double
          nullable: true
        volume:
          type: number
          nullable: true
        feature:
          $ref: "#/components/schemas/RealtimeFeature"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/MinuteBar"
        plan:
          type: object
          additionalProperties: true
        decision:
          $ref: "#/components/schemas/Decision"
    RealtimeFeature:
      type: object
      properties:
        minute_volume_ratio:
          type: number
          nullable: true
        sector_rise_ratio:
          type: number
          nullable: true
        sector_sample_size:
          type: integer
          nullable: true
        data_state:
          type: string
        computed_at:
          type: string
          format: date-time
          nullable: true
    MinuteBar:
      type: object
      properties:
        time:
          type: string
          format: date-time
        price:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
        amount:
          type: number
    MonitorSnapshot:
      type: object
      required:
        - trade_date
        - plan_id
        - strategy_version
        - server_time
        - data_status
        - stocks
      properties:
        trade_date:
          type: string
          format: date
        reference_date:
          type: string
          format: date
        plan_id:
          type: string
        strategy_version:
          type: string
        server_time:
          type: string
          format: date-time
        data_status:
          $ref: "#/components/schemas/DataStatus"
        phase:
          type: string
        phase_label:
          type: string
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/StockSnapshot"
    DecisionEvent:
      type: object
      required:
        - event_id
        - plan_id
        - symbol
        - state
        - reason_code
        - occurred_at
      properties:
        event_id:
          type: string
        plan_id:
          type: string
        symbol:
          $ref: "#/components/schemas/Symbol"
        previous_state:
          allOf:
            - $ref: "#/components/schemas/DecisionStateCode"
          nullable: true
        state:
          $ref: "#/components/schemas/DecisionStateCode"
        reason_code:
          type: string
        reason:
          type: string
        source_event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
    MarketSummary:
      type: object
      required: [regime, score, limit_up_count, max_board]
      properties:
        regime:
          type: string
        score:
          type: number
        limit_up_count:
          type: integer
        broken_board_count:
          type: integer
          nullable: true
        break_rate_pct:
          type: number
          nullable: true
        max_board:
          type: integer
    Candidate:
      type: object
      required:
        - rank
        - symbol
        - name
        - score
        - entry_trigger
        - invalidation
      properties:
        rank:
          type: integer
        symbol:
          $ref: "#/components/schemas/Symbol"
        name:
          type: string
        industry:
          type: string
        score:
          type: number
        strategy:
          type: string
        latest_price:
          type: number
        amount_cny:
          type: number
        reasons:
          type: array
          items:
            type: string
        entry_trigger:
          type: string
        invalidation:
          type: string
        exit_plan:
          type: string
        position_limit_pct:
          type: integer
    ReportSummary:
      type: object
      required:
        - trade_date
        - plan_date
        - generated_at
        - candidate_count
        - strategy_version
      properties:
        trade_date:
          type: string
          format: date
        plan_date:
          type: string
          format: date
        generated_at:
          type: string
          format: date-time
        candidate_count:
          type: integer
        market_regime:
          type: string
        market_score:
          type: number
        strategy_version:
          type: string
    DailyReport:
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          required: [market, candidates, disclaimer]
          properties:
            strategy_revision:
              type: string
              nullable: true
            strategy_config:
              type: object
              additionalProperties: true
            constraints:
              type: object
              additionalProperties: true
            market:
              $ref: "#/components/schemas/MarketSummary"
            candidates:
              type: array
              items:
                $ref: "#/components/schemas/Candidate"
            data_source:
              type: string
            data_sessions:
              type: array
              items:
                type: string
                format: date
            rejected_count:
              type: integer
            disclaimer:
              type: string
    ReportRefreshJob:
      type: object
      required: [job_id, status, payload, created_at]
      properties:
        job_id:
          type: string
        job_type:
          type: string
          enum: [report_refresh]
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        attempt:
          type: integer
          minimum: 0
        payload:
          type: object
          required: [trade_date]
          properties:
            trade_date:
              type: string
              format: date
            requested_by:
              type: string
        result:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    StrategyRun:
      type: object
      required:
        - run_id
        - trade_date
        - strategy_version
        - status
        - created_at
      properties:
        run_id:
          type: string
        trade_date:
          type: string
          format: date
        strategy_version:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
    StrategyHistoryJob:
      type: object
      required: [job_id, job_type, status, payload]
      properties:
        job_id:
          type: string
          format: uuid
        job_type:
          type: string
          enum: [strategy_history]
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        attempt:
          type: integer
          minimum: 0
        payload:
          type: object
          required: [strategy_id, history_range, start, end, datasets]
          properties:
            strategy_id:
              type: string
              format: uuid
            history_range:
              type: string
              enum: [1d, 1w, 1m, 1y]
            start:
              type: string
              format: date
            end:
              type: string
              format: date
            datasets:
              type: array
              items:
                type: string
                enum: [next_plan, intraday_monitor]
        result:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true
    Strategy:
      type: object
      required: [strategy_id, code, name, enabled, archived, is_initial, permissions, key_parameters, revision]
      properties:
        strategy_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        archived:
          type: boolean
        is_initial:
          type: boolean
        permissions:
          type: object
          required: [edit_parameters, save_as, delete]
          properties:
            edit_parameters:
              type: boolean
            save_as:
              type: boolean
            delete:
              type: boolean
        history_generation:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StrategyHistoryJob"
        parent_strategy_id:
          type: string
          format: uuid
          nullable: true
        config_changes:
          type: object
          additionalProperties: true
        key_parameters:
          $ref: "#/components/schemas/StrategyKeyParameters"
        revision:
          type: string
          pattern: '^[a-f0-9]{64}$'
    StrategyKeyParameters:
      type: object
      required:
        - minimum_score
        - minimum_amount_cny
        - maximum_amount_cny
        - minimum_turnover_pct
        - maximum_turnover_pct
        - minimum_float_market_cap_cny
        - maximum_float_market_cap_cny
        - minimum_industry_limit_up_count
        - entry_cutoff_time
      properties:
        minimum_score:
          type: number
        minimum_amount_cny:
          type: number
        maximum_amount_cny:
          type: number
        minimum_turnover_pct:
          type: number
        maximum_turnover_pct:
          type: number
        minimum_float_market_cap_cny:
          type: number
        maximum_float_market_cap_cny:
          type: number
        minimum_industry_limit_up_count:
          type: integer
        entry_cutoff_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
    RenameStrategyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    SetStrategyActiveRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    CreateStrategyRequest:
      type: object
      required: [name, parent_strategy_id, config, revision]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        parent_strategy_id:
          type: string
          format: uuid
        config:
          type: object
          additionalProperties: true
        revision:
          type: string
        activate:
          type: boolean
          default: false
        history_range:
          type: string
          enum: [1d, 1w, 1m, 1y]
          default: 1y
    StrategyConfigPayload:
      type: object
      required: [config, defaults, groups, fields, revision]
      properties:
        config:
          type: object
          additionalProperties: true
        defaults:
          type: object
          additionalProperties: true
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
        revision:
          type: string
    StrategyDaySummary:
      type: object
      required: [trade_date, plan_status, actual_status, updated_at]
      properties:
        trade_date:
          type: string
          format: date
        plan_date:
          type: string
          format: date
          nullable: true
        candidate_count:
          type: integer
          nullable: true
        execution_count:
          type: integer
          nullable: true
        plan_status:
          type: string
          enum: [ready, pending]
        actual_status:
          type: string
        summary:
          type: object
          additionalProperties: true
        strategy_version:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
    StrategyDay:
      allOf:
        - $ref: "#/components/schemas/StrategyDaySummary"
        - type: object
          properties:
            next_plan:
              type: object
              nullable: true
              additionalProperties: true
            execution_plan:
              type: object
              nullable: true
              additionalProperties: true
            actuals:
              type: object
              additionalProperties: true
    ResearchSummary:
      type: object
      required: [run_id, start_date, end_date, created_at]
      properties:
        run_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        strategy_status:
          type: string
          nullable: true
    ResearchRun:
      type: object
      required: [run_id, strategy, assets]
      additionalProperties: true
      properties:
        run_id:
          type: string
          format: uuid
        strategy:
          type: object
          additionalProperties: true
        assets:
          type: array
          items:
            type: object
            required: [filename, object_key, content_type]
            properties:
              filename:
                type: string
              object_key:
                type: string
              content_type:
                type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
security:
  - bearerAuth: []
